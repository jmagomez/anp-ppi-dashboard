name: Atualizar PPI (ANP)

on:
  schedule:
    # Segunda-feira, 20:00 America/Sao_Paulo (UTC-3) = 23:00 UTC
    - cron: "0 23 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/atualizar-ppi.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-ppi
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar e processar dados da ANP
        run: python scripts/build_data.py

      - name: Resumo da execucao
        run: |
          echo '### PPI ANP - atualizacao' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' docs/data/meta.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar dados atualizados
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if git diff --staged --quiet; then
            echo 'Nenhuma mudanca nos dados.'
          else
            git commit -m "chore(dados): atualiza PPI da ANP ($(TZ=America/Sao_Paulo date +%Y-%m-%d))"
            git push
          fi
