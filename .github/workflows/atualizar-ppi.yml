name: Atualizar PPI (ANP)

on:
  schedule:
    # Segunda-feira, 20:00 America/Sao_Paulo (UTC-3) = 23:00 UTC.
    # Melhor janela da semana: a ANP publica o PPI na propria segunda e a
    # planilha de produtores entra cerca de 10 dias apos o fim da semana.
    # Esta e a unica execucao que dispara o e-mail.
    - cron: "0 23 * * 1"
    # Todo dia as 08:00 America/Sao_Paulo = 11:00 UTC, so coleta.
    # Se a ANP atrasar a publicacao de segunda, o painel se atualiza no dia
    # seguinte em vez de ficar uma semana parado. Commit so sai se o dado mudar.
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/atualizar-ppi.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-ppi
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar e processar dados da ANP
        run: python scripts/build_data.py

      - name: Resumo da execucao
        run: |
          echo '### PPI ANP - atualizacao' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' docs/data/meta.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar dados atualizados
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if git diff --staged --quiet; then
            echo 'Nenhuma mudanca nos dados.'
          else
            git commit -m "chore(dados): atualiza PPI da ANP ($(TZ=America/Sao_Paulo date +%Y-%m-%d))"
            git push
          fi

      # Envia so no agendamento de segunda-feira e nas execucoes manuais.
      # A coleta diaria e os commits de codigo atualizam o painel em silencio.
      - name: Enviar e-mail semanal
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 23 * * 1')
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.MAIL_USERNAME }}
          SMTP_PASS: ${{ secrets.MAIL_PASSWORD_ANP }}
          MAIL_TO: ${{ secrets.MAIL_USERNAME }}
          DASHBOARD_URL: https://jmagomez.github.io/anp-ppi-dashboard/
        run: python scripts/email_semanal.py
